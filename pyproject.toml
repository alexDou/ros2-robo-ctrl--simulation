[project]
name = "ros2-robot-controller-simulation"
version = "0.1.0"
description = "ROS2 robot controller simulation - Edge AI & Ingestion Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eclipse-zenoh>=1.1.0",
    "onnxruntime>=1.18.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = [
    "ultralytics>=8.2.0",
]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0",
    "lark>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_node", "src/domain"]

[dependency-groups]
dev = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

