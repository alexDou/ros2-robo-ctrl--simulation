[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
actix-web.workspace = true
actix-ws.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
zenoh.workspace = true
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
futures-util.workspace = true
cdr = "0.2.4"

[dev-dependencies]
actix-web = { workspace = true }
tokio-tungstenite = "0.24"
# Virtual clock for the rate tests: a 30 Hz band asserted on wall time jitters under CPU load.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "domain_contract"
path = "tests/domain_contract.rs"

[[test]]
name = "ws_gateway"
path = "tests/ws_gateway.rs"

[[test]]
name = "telemetry_throttler"
path = "tests/telemetry_throttler.rs"
