controller_manager:
  ros__parameters:
    update_rate: 5  # 5 Hz sim loop (GenericSystem fake hardware, non-RT host); real UR uses ur_controllers_real.yaml at 500 Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 5.0
    action_monitor_rate: 2.0
    allow_partial_joints_goal: false
    # trajectory: 0.0 disables the path check. The GenericSystem mock mirrors commands into state,
    # so path error here only measures loop jitter (one 5 Hz overrun at 2 rad/s reads as
    # 0.3-0.7 rad and aborted PickAndPlace, hand-sim-pabi). Goal check kept; real UR keeps 0.2.
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.0, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.0, goal: 0.1 }
      elbow_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.0, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.0, goal: 0.1 }
